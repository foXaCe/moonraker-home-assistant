[tool.ruff]
target-version = "py312"
line-length = 88

[tool.mypy]
strict = true

[[tool.mypy.overrides]]
# moonraker-api ships no py.typed marker, so its public API is untyped.
module = ["moonraker_api.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = [".git"]
addopts = "--strict-markers --cov=custom_components"
asyncio_mode = "auto"
