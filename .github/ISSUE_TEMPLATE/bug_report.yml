name: Bug Report
description: Report a bug in Moonraker Home Assistant
title: "[Bug]: "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug! Please provide as much information as possible.

  - type: input
    id: ha-version
    attributes:
      label: Home Assistant version
      placeholder: e.g. 2026.7.2
    validations:
      required: true

  - type: input
    id: integration-version
    attributes:
      label: Integration version
      placeholder: e.g. 1.13.4
    validations:
      required: true

  - type: input
    id: klipper-setup
    attributes:
      label: Printer / Klipper / Moonraker setup
      placeholder: e.g. Voron 2.4, Mainsail OS, Moonraker v0.9.x

  - type: dropdown
    id: install-method
    attributes:
      label: Installation method
      options: [HACS, Manual, Other]
    validations:
      required: true

  - type: textarea
    id: bug-description
    attributes:
      label: Bug description
      description: What happens? What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: |
        1.
        2.
        3.
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: Settings → System → Logs (filter by "moonraker")
      render: shell
