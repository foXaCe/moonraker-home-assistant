name: CI actions

on:
  pull_request:
  push:
    branches:
      - main
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: "ubuntu-latest"
    name: Validate
    timeout-minutes: 15
    steps:
      - uses: "actions/checkout@v7"

      - name: HACS validation
        uses: "hacs/action@main"
        with:
          category: "integration"
          ignore: brands

      - name: Hassfest validation
        uses: "home-assistant/actions/hassfest@master"

  ruff:
    name: "Ruff"
    runs-on: "ubuntu-latest"
    timeout-minutes: 15
    steps:
      - name: "Checkout the repository"
        uses: "actions/checkout@v7"

      - name: "Set up Python"
        uses: actions/setup-python@v7
        with:
          python-version: "3.15"
          cache: "pip"

      - name: "Install requirements"
        run: python3 -m pip install -r requirements.txt

      - name: "Run"
        run: python3 -m ruff check .

  tests:
    runs-on: "ubuntu-latest"
    name: Run tests
    timeout-minutes: 30
    steps:
      - name: Check out code from GitHub
        uses: "actions/checkout@v7"
      - name: Setup Python
        uses: "actions/setup-python@v7"
        with:
          python-version: "3.15"
          cache: "pip"
      - name: Check that Home Assistant can install the manifest requirements
        # Same constraints as Home Assistant itself, which the tests do not use.
        run: |
          curl -fsSL -o ha_constraints.txt \
            https://raw.githubusercontent.com/home-assistant/core/master/homeassistant/package_constraints.txt
          python3 -c "import json; print(*json.load(open('custom_components/moonraker/manifest.json'))['requirements'], sep='\n')" > manifest_requirements.txt
          python3 -m pip install --dry-run -c ha_constraints.txt -r manifest_requirements.txt
      - name: Install requirements
        run: python3 -m pip install -r requirements.txt
      - name: Run tests
        run: |
          pytest . --cov=custom_components.moonraker --cov-report=xml
      - name: Upload coverage reports to Codecov with GitHub Action
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
